name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25.x"
  # CI 从模块代理按 go.mod 锁定版本解析依赖，不依赖开发期 go.work 本地产库。
  GOWORK: "off"

# 2026-10-29：11 个 job 全部转绿。历史红灯的成因写在各 job 内联注释里，避免下次重新排查：
#   lint      长期红 → web/dist 缺占位文件，`go vet ./...` 报 embed 空目录，连带 test/race/
#             corpus/postgres/s3 全部 skipped（commit 8c47e9d）；
#   frontend  i18n 门禁 12 条死文案 → 分诊删除；另补回 SettingsContextRules 在用但缺失的
#             common.yes / common.no（此前界面会原样显示 key）；
#   postgres  迁移非幂等（0029 函数改名 / 0037 ADD COLUMN / 0040 约束重加）＋ 库名不对导致
#             函数授权分支不生效（commit 9914925 与本轮）；用例读讲稿的源版本号也全部对齐；
#   s3        MinIO 社区版停发镜像/二进制 → 改用其接续维护分支 SILO（pgsty/silo），
#             tag + digest 双锁（见 s3 job 内注释）。
#   lint(2)   改结构体漏跑 gofmt：本地 Windows 检出是 CRLF，`gofmt -l .` 会把一大堆文件
#             报成未格式化（真信号被噪声盖住），于是本地习惯性跳过这一步；CI 在 LF 检出上
#             一跑就红，且 28s 结束、其余 6 个 job 全部 skipped（88f0d13 修）。
#             本地等价判据：忽略换行风格比对内容 ——
#             `diff <(gofmt f | tr -d '\r') <(tr -d '\r' < f)`。

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      # 成品包门禁（tasks 7.2）：实际产出一个样例包（zip 与目录两种形态），
      # 用 share-verify 跑与单测同一套结构校验 + 外链扫描。任何"给播放器加 CDN
      # 字体/遥测脚本"的改动都会让这一步失败，而不是等到用户断网打不开才发现。
      #
      # `-budget` 不能省：不带它时体积超标只进报告、退出码仍是 0，V15 就成了一条
      # 只警告不拦人的门禁——多存一份音频、层图忘压缩，CI 照样绿。
      - name: share bundle external-ref scan
        run: |
          rm -rf /tmp/bundle /tmp/bundle.zip
          go run ./cmd/share-baseline -pages 3 -page-secs 4 -zip /tmp/bundle.zip -out /tmp/bundle >/dev/null
          go run ./cmd/share-verify -budget /tmp/bundle.zip
          go run ./cmd/share-verify -budget /tmp/bundle

  # 成品包的浏览器门禁（V16 可播放性 / V17 降级矩阵）。
  #
  # 这两项此前只在本地跑得起来：探针把 Chrome 钉在镜像里的 /opt/chrome、
  # 把 ws 钉在 /app/node_modules，想跑就得先构建渲染镜像。于是「包在真实浏览器里
  # 能不能播」在合并前从没有人验过——而它恰好是唯一一类读代码看不出来的问题
  # （删掉一张清单引用的层图，页面照样"看起来正常"，只是那一层没了）。
  #
  # 现在探针自己探测浏览器、用 Node 22 自带的 WebSocket，不再依赖镜像。
  share-browser:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # 必须是 22+：探针用的是全局 WebSocket（undici），Node 20 上会退回 require('ws')，
      # 而这条路径上没有装 ws 的步骤。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 解析浏览器
        run: |
          set -euo pipefail
          chrome=""
          if command -v google-chrome >/dev/null; then
            chrome=$(command -v google-chrome)
          elif [ -x /opt/google/chrome/chrome ]; then
            chrome=/opt/google/chrome/chrome
          else
            # 兜底：runner 镜像某天不再预装 Chrome 时，按需拉一份 headless shell
            # ——正是渲染镜像里跑的那一个二进制，判据不会因此改变。
            npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome" >/dev/null
            chrome=$(find "$RUNNER_TEMP/chrome" -type f -name chrome-headless-shell | head -1)
          fi
          echo "PPT_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version || true
      # -layers 2 不是装饰：V17 的判据全落在 `.ppts-layer` 上，不带图层的包会让
      # 四项判据直接红（默认态无位移、reduced 无 opacity、时长集合为空、无 WAAPI 无层）。
      # 也就是说「把 V17 放进 CI」和「基线能造出真图层」是同一件事。
      - name: 造一个带图层的样例包
        run: |
          rm -rf /tmp/pkg /tmp/pkg.zip
          go run ./cmd/share-baseline -pages 3 -page-secs 4 -layers 2 -zip /tmp/pkg.zip -out /tmp/pkg >/dev/null
      - name: 浏览器门禁（V14–V17）
        run: python3 scripts/review/bundle-gate.py --pkg /tmp/pkg --engine native
      # 单文件形态（ADR-029 ⑤ / ADR-033）：与目录包同一批判据，区别只有清单来源——
      # 探针从**还原后**的 window.__PPT_MANIFEST__ 读，而不是读 manifest.json。
      # 这条以前是手工跑的；而它恰好守着 zip 形态看不见的一类故障：token 没还原成
      # data URI（清单里 30 段音频各指同一条 mix，逐处内联会得到 618 MB 的包）、
      # 或还原步骤被挪到 app.js 之后（第一帧就拿 token 当路径，黑屏）。
      - name: 造一个单文件样例
        run: |
          rm -f /tmp/single.html
          go run ./cmd/share-baseline -pages 3 -page-secs 4 -layers 2 -single /tmp/single.html >/dev/null
      - name: 单文件门禁（V14/V16/V17）
        run: python3 scripts/review/bundle-gate.py --single /tmp/single.html --engine native
      # 跨页延续（G8）：夹具必须显式 -continuation（默认注入会让 V13b 的末帧比对假红，
      # 因为延续元素在页尾本就是中途态），且页长要大于 offset（6s > 3s）才溢得出去。
      # 判据在 seam-gate（V19）：读成品包清单 + shared/motion.ts 在页缝两侧求值，
      # 断言链接字段（elementId/offset/负起点）、源段配对与数值连续。0 条延续段也算红，
      # 否则夹具一坏，这条门禁就会静默空绿——那比没有门禁更危险。
      - name: 造一个含跨页延续的样例包
        run: |
          rm -rf /tmp/pkg-cont
          go run ./cmd/share-baseline -pages 3 -page-secs 6 -layers 2 -continuation -out /tmp/pkg-cont >/dev/null
      - name: 页缝延续门禁（V19）
        run: node --experimental-strip-types scripts/review/seam-gate.mjs --pkg /tmp/pkg-cont
      # 终态帧门禁（V13b）：每页结尾那一帧必须等于参照图，参照物不是成片，
      # 所以不需要渲染镜像——这是 V13（DOM vs MP4）第一次有了不依赖镜像的那一半。
      # 尺寸必须 1:1：`--stage` 去掉播放器卡片的 1280 上限后，舞台按源页尺寸画，
      # 因此比对里不掺重采样（实测 1920 页的 meanDiff 0.0007）。
      # 两条包：一条没有页内镜头（回归，读数应与引入镜头之前同量级），
      # 一条有（末帧是特写，参照物换成镜头图）。只跑后者会看不见回归，
      # 只跑前者则「末帧是特写」这条路径从没被验过。
      - name: 终态帧门禁（V13b）
        run: |
          python3 -m pip install --quiet numpy pillow
          rm -rf /tmp/fixture /tmp/fixture-shots
          go run ./cmd/share-baseline -pages 2 -page-secs 4 -width 1280 -height 720 \
            -layers 2 -pages-out /tmp/fixture/pages -out /tmp/fixture/pkg >/dev/null
          go run ./cmd/share-baseline -pages 2 -page-secs 4 -width 1280 -height 720 \
            -layers 2 -shots 2 -pages-out /tmp/fixture-shots/pages -out /tmp/fixture-shots/pkg >/dev/null
          echo '--- 无页内镜头 ---'
          python3 scripts/review/settled-gate.py --pkg /tmp/fixture/pkg --pages /tmp/fixture/pages
          echo '--- 有页内镜头（末帧是特写）---'
          python3 scripts/review/settled-gate.py --pkg /tmp/fixture-shots/pkg \
            --pages /tmp/fixture-shots/pages --out /tmp/fixture-shots/settled
      # V18：V13b 只看末帧，把「切镜」整个删掉它照样过。这条专门验中间那次切换：
      # 切点前后的主图、叠化窗口、层节点没被重建、特写镜内层不显示。
      - name: 切图门禁（V18）
        run: python3 scripts/review/shot-gate.py --pkg /tmp/fixture-shots/pkg

      # V20 埋点完整性（设计 §20.8）：编号刻意跳过 V18/V19——那两个已被切图与页缝
      # 门禁占用。编号仅在本 M6-4 门禁体系内唯一：保真链 scripts/fidelity/verify.py
      # 另有一组 V20（矩形焦点遮罩），两者不共用命名空间，引用时须带体系名。
      # 这里验的是**客户拿到的成品包**：埋点符号有没有编译进去、四个进度桶
      # 和隐私开关齐不齐、meta CSP 有没有 connect-src 'self'（在线时与响应头 CSP 取交集，
      # 缺这条同源上报会被静默拦下），以及 V14 零外链有没有被埋点破坏。
      # 行为判据在 web/share-telemetry-check.mjs 与 Go 侧 events 单测；本步守产物漂移。
      - name: 埋点完整性门禁（V20）
        run: node scripts/review/telemetry-gate.mjs --pkg /tmp/pkg

      # V13（包端 vs 成片）以前是自证的：夹具按 30fps 把包自己的 DOM 截出来编码成「成片」，
      # 所以那一步只能验「截图落点 / 抽帧 / 解码 / 阈值」这条管线，验不了「两端是否一致」——
      # 两端本来就是同一张图。现在成片走产品真正的渲染路径（RemotionBackend → render.mjs →
      # Chromium 逐帧 → H.264），包走产品真正的打包路径，两者同源于一份 IR（cmd/film-baseline）。
      # 代价是这一步要在 runner 上装渲染依赖（npm ci，约 1 分钟）与 ffmpeg（下面已装）。
      # 判据也收紧了：全帧 SSIM 会被静止背景稀释（实测 6px 位移只从 0.9947 掉到 0.9826），
      # 所以另有运动区域 SSIM 与区域 p99 两条，见 dom-ssim.py 文件头。
      # 夹具带页内切镜：镜头图两端各有发布者（打包器与渲染服务 staging），缺一边时成片
      # 只会安静地退回整页——那正是这条门禁要看见的东西。
      - name: 造同源夹具（包 + 真成片）
        run: |
          command -v ffmpeg >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          }
          ( cd renderer && npm ci --omit=dev )
          # 显式写死这两项，别依赖默认值：它们决定夹具覆盖什么——每页 2 镜（让页内切镜
          # 进比对）与 2× 页图（贴近生产的 300 DPI，特写是缩小而不是放大）。
          go run ./cmd/film-baseline -out /tmp/v13real -chrome "$PPT_CHROME" \
            -renderer-script renderer/render.mjs \
            -shots-per-page 2 -page-scale 2
      - name: 同帧 SSIM 门禁（V13）
        run: |
          python3 scripts/review/dom-ssim.py --plan /tmp/v13real/render/plan.json \
            --pkg /tmp/v13real/pkg --segments /tmp/v13real/render --out /tmp/v13real/gate

  # 配音 PPTX 的包结构门禁（G0-8 里与客户端无关的那一半）。
  #
  # 客户端那一半——PowerPoint 打开、另存、重开——只能在 Windows 上跑（COM），
  # 见 scripts/fidelity/README.md「配音 PPTX 的客户端门禁」。这里守的是不需要
  # 客户端也能判的部分：进页即播（mediacall + playFrom(0.0)）、离页即停
  # （onStopAudio、且无 numSld 跨页声明）、每页各用自己的音轨、advTm 与页面时长一致。
  # 这些正是「配了音却不出声 / 翻页后上一页还在响」的成因，而它们都能在 Linux 上判。
  #
  # 生成器走产品同一条写入路径（integrations.GoPPTXNarrationWriter），所以这条门禁
  # 也会拦住写入侧的回归，而不是只测一段测试专用的拼装代码。
  narrated-pptx:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: 生成并校验配音 PPTX
        run: |
          mkdir -p /tmp/narration
          go run ./scripts/e2e/audiogate -out /tmp/narration/gate.pptx -plan-out /tmp/narration/plan.json
          go run ./scripts/e2e/audiogate/verify -pptx /tmp/narration/gate.pptx -plan /tmp/narration/plan.json

  # 竞态检测（M1 tasks 6.2 / ADR-11）：开发机是 Windows + CGO_ENABLED=0 且无任何 C 工具链，
  # race detector 依赖 cgo，本地跑不了，只能在这里跑。范围限定在引入并发的包，
  # 不做全仓 -race（相对耗时远大于收益）。internal/tenant 是 ADR-037 的策略缓存
  # （在途合流 + 命中计数），并发路径必须过 race。首次跑绿后才可以勾掉 tasks 6.2。
  race:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race
        run: go test -race -count=1 ./internal/render/... ./cmd/renderer/... ./internal/animation/... ./internal/tenant/...

  # 独立模块 textnorm/：可在没有 PPTS 其余源码时独立构建/测试（纯标准库）。
  # 语料 JSON 随模块入库，作为行为契约在 CI 回放。
  textnorm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        working-directory: textnorm
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        working-directory: textnorm
        run: go vet ./...
      - name: go build
        working-directory: textnorm
        run: go build ./...
      - name: go test -race
        working-directory: textnorm
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: i18n check
        working-directory: web
        run: npm run i18n:check
      - name: api contract check
        working-directory: web
        run: npm run api:check
      - name: route inventory check
        working-directory: web
        run: npm run route:check
      - name: build
        working-directory: web
        run: npm run build
      # 作者侧成品分享控制台：build 链里已跑静态判据（含四条诚实口径与早退分支），
      # 这里再跑一次变异自测，证明那些判据不是恒真的摆设——删掉采集关闭分支、
      # 在组件里私加 fetch、放开 html_single 守卫、抹掉留存窗口说明，各自必须打红。
      - name: artifact share console gate self-test
        working-directory: web
        run: npm run artifact-share:self-test
      # 分享播放器产物入库（go:embed 依赖），必须保证「源码改了但没重新生成」在 CI 就失败，
      # 否则用户下载到的成品包会带着旧播放器（与 catalog 生成物同一纪律）。
      - name: share player build (drift check)
        working-directory: web
        run: |
          npm run build:share
          git -C .. diff --exit-code internal/share/assets/app.js internal/share/assets/app.css
      # 插值语义矩阵（shared/motion.ts）：两端共用同一份求值代码，
      # 语义一旦变化，DOM 端与帧端会以**不同方式**错，且单条 clip 的页看不出来。
      # 这条必须跑在 renderer degrade check 之前——后者依赖同一份 motion.ts。
      - name: shared motion semantics
        run: |
          node --experimental-strip-types --test shared/motion-check.mjs
          # 页内镜头的求值矩阵。与 motion 同一类理由：区间端点差一帧时，
          # 两端会在同一时刻给出两张不同的图，而单端截图看不出来。
          node --experimental-strip-types --test shared/shots-check.mjs
      # 单页降级（tasks 3.7）是纯函数 + 一条对 motion.ts 的语义依赖，
      # 不需要 npm ci 也不需要 Chrome：它只 import 仓库内的 .mjs/.ts。
      # 真渲染路径靠容器内的故障注入验收，这条守的是「冻结一页」的语义不被改坏。
      - name: renderer degrade check
        run: node --experimental-strip-types --test renderer/degrade-check.mjs
      # 渲染器页缝验收（G8 边界 ②）：共用 evaluateLayer 让负起点「在数据上成立」，
      # 但渲染器按帧网格取样（末帧到页尾最多差 1/fps），且它随时可能把 tMs 夹到
      # [0, pageMs] 或丢掉负 startMs——这两类改动在单页截图上都看不出来。
      # 负对照（把延续段按重置写法求值）保证阈值没有宽到失去区分力。
      - name: renderer seam check
        run: node --experimental-strip-types --test renderer/seam-check.mjs

  # 镜像可运行性门禁。
  #
  # 为什么单开一个 job：CI 在此之前**从不构建镜像**，于是只存在于镜像构建期的问题
  # 全部只能在真机上撞见。2026-11-02 在真机跑一次真实导出，一次性撞到三个，而当时
  # CI 是 11 个 job 全绿：
  #   1. `.dockerignore` 整目录排除 web → `//go:embed web` 直接编译失败；
  #   2. Dockerfile.worker 下载静态 ffmpeg 走 HTTP/2 传输中途断流（curl exit 18）；
  #   3. renderer 镜像缺两个必需文件。
  # 第 1 条尤其说明「构建退出码」为什么不够当判据：Dockerfile.api 依赖 `COPY web/dist`，
  # 而 web/dist 在仓库里只有 .gitkeep（其余全被 .gitignore 挡掉）。在干净检出上直接
  # docker build，镜像会**构建成功**——只是容器里没有前端：/healthz 200，`/` 404。
  # 两者都不报错，部署出去才发现是白屏。所以本 job 的判据是「把容器跑起来、真取到前端」。
  #
  # 反面约束：这里**不跑** scripts/e2e/export_live.sh。那条链路要渲染镜像（3GB + Chrome）
  # 与 LibreOffice 全量渲染，单次十几分钟，放进 PR 门禁只会被绕过。它保持在本地手动跑。
  images:
    runs-on: ubuntu-latest
    needs: lint
    # worker 镜像要拉 LibreOffice（约 250MB）与静态 ffmpeg（40MB），比其它 job 慢得多。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 镜像契约：Dockerfile.api 的 `COPY web/dist` 要求前端**先**构建好。
      # 这条步骤不能删（删了镜像里就是空的），也不能"删了还照样绿"——下一步断言产物。
      - name: 构建前端（Dockerfile.api 的构建输入）
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: 断言前端产物非空
        run: |
          test -f web/dist/index.html
          grep -q 'id="root"' web/dist/index.html
      - uses: docker/setup-buildx-action@v3
      # 两个镜像共用 golang:1.25-bookworm 与 `go mod download` 层，第二次构建会命中缓存；
      # gha cache 让这一层跨 run 复用，否则每次都要重新拉 800MB 基础镜像。
      - name: 构建 api 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: ppts-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: 构建 worker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: ppts-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      # worker 镜像的外部依赖全部对应代码里的 exec.LookPath 调用点。Dockerfile 的构建期
      # 断言只覆盖了 ffmpeg 的 subtitles 滤镜，soffice / pdftoppm 没有任何检查——
      # 少了它们，导出会在"解析 PPTX"这一步失败，而镜像本身构建得好好的。
      - name: 断言 worker 镜像的外部依赖齐备
        run: |
          docker run --rm --entrypoint sh ppts-worker:ci -c '
            set -e
            for c in ffmpeg ffprobe soffice pdftoppm pdfinfo; do
              command -v "$c" >/dev/null || { echo "缺可执行文件: $c"; exit 1; }
            done
            ffmpeg -hide_banner -filters 2>/dev/null | grep -qw subtitles \
              || { echo "ffmpeg 缺 subtitles 滤镜（字幕烧录会失败）"; exit 1; }
            echo "worker 外部依赖齐备"
          '
      # 镜像以 UID 10001 运行，/data 下的挂载点必须可写：db 要跑迁移，objects 要落页图。
      # tmpfs 的 mode=1777 正是为了这一点（直接挂空目录会是 root:root 0755）。
      #
      # PPTS_AUTH_DEV_HEADERS 不是可选装饰：不配它也不配 PPTS_JWT_SECRET 时，进程启动阶段
      # 直接 `no authenticator configured` 退出（实测：容器 3 秒后 Exited(1)，日志只有这一行）。
      # 本步骤只验"镜像里的前端能不能被取到"，不涉及鉴权，用 dev 头是最小依赖。
      # 生产部署绝不能带这一条——它接受未签名的租户/用户头。
      - name: 起 api 容器并断言前端真的能被取到
        run: |
          set -euo pipefail
          docker run -d --name ppts-api-ci -p 127.0.0.1:18080:8080 \
            -e PPTS_HTTP_ADDR=:8080 \
            -e PPTS_DB_DRIVER=sqlite \
            -e PPTS_DATABASE_URL=/data/db/ci.db \
            -e PPTS_OBJECT_BACKEND=local \
            -e PPTS_OBJECT_ROOT=/data/objects \
            -e PPTS_OBJECT_SECRET=ci-only-not-a-secret \
            -e PPTS_AUTH_DEV_HEADERS=true \
            --tmpfs /data/db:rw,mode=1777,size=64m \
            --tmpfs /data/objects:rw,mode=1777,size=64m \
            ppts-api:ci server

          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          # 探活通过不等于服务可用：上一层的 COPY 曾经把空目录拷进去，/healthz 照样 200。
          health=$(curl -fsS http://127.0.0.1:18080/healthz) \
            || { echo "healthz 不可达"; docker logs ppts-api-ci; exit 1; }
          echo "healthz: $health"
          case "$health" in
            *'"ok"'*) ;;
            *) echo "healthz 不是 ok"; exit 1;;
          esac

          # 核心判据：根路径必须拿到真正的 index.html，而不是 404 / 空 body。
          body=$(curl -fsS http://127.0.0.1:18080/) \
            || { echo "GET / 失败——镜像里没有前端（Dockerfile.api 的 COPY web/dist 拷空了？）"; \
                 docker logs ppts-api-ci; exit 1; }
          case "$body" in
            *'id="root"'*) ;;
            *) echo "GET / 返回的不是 SPA 入口："; echo "$body" | head -c 300; exit 1;;
          esac

          # 光有 index.html 不够：它引用的哈希资源也必须真的在镜像里，否则页面白屏。
          asset=$(echo "$body" | grep -o '/assets/index-[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "index.html 没有引用构建产物"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$asset")
          echo "GET $asset -> $code"
          [ "$code" = "200" ] || { echo "静态资源取不到，镜像里的 assets 不完整"; exit 1; }

          echo "api 镜像可运行：前端入口与哈希资源都可取"
      - name: 失败时打印容器日志
        if: failure()
        run: docker logs ppts-api-ci 2>&1 | tail -60 || true
      - name: 清理
        if: always()
        run: docker rm -f ppts-api-ci >/dev/null 2>&1 || true

  # CGO_ENABLED=0 交叉构建：验证架构约束（对齐 go-pptx 的 CI 惯例）。
  crossbuild:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: cross build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build ./cmd/...

  # 语料回放：默认测试不含 -tags=corpus；本 job 独立运行，缺源文件的条目 Skip 不红。
  corpus:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          repository: F31/go-pptx
          path: _corpus/go-pptx
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: corpus replay
        env:
          GOPPTX_CORPUS: ${{ github.workspace }}/_corpus/go-pptx/testdata/corpus
        run: go test -tags=corpus ./internal/project/ -run TestCorpusReplayInspect

  # 多租户/幂等测试：需要 PostgreSQL。迁移按角色模型执行（postgres owner / ppts_app 运行账号）。
  postgres:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # 库名必须是 ppts_test：多条迁移把「给 ppts_app 授予函数/表的执行权」限制在
          # `IF current_database() = 'ppts_test'` 分支里（生产不放权，避免应用账号直接调
          # 调度函数）。此前这里是 ppts，迁移照常通过，但 ppts_app 拿不到
          # ppts_claim_next_job 的 EXECUTE，pipeline 的 4 个用例报 42501 permission denied。
          # docker-compose.yml 的本地测试库同样叫 ppts_test。
          POSTGRES_DB: ppts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: prepare database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ppts_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ppts_app LOGIN PASSWORD 'ppts_app' NOSUPERUSER NOBYPASSRLS;"
          for f in migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d ppts_test -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d ppts_test -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE ON SCHEMA public TO ppts_app;
             GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ppts_app;
             GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ppts_app;"
      - name: migration replay (idempotency)
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.sql; do
            echo "replaying $f"
            psql -h localhost -U postgres -d ppts_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: pg tests
        env:
          PPTS_TEST_DATABASE: postgres://ppts_app:ppts_app@localhost:5432/ppts_test?sslmode=disable
        run: go test -tags=pg -p 1 ./... -count=1

  # S3 兼容适配器测试：真实 S3 服务端。
  s3:
    runs-on: ubuntu-latest
    needs: lint
    env:
      # SILO（pgsty/silo）是 MinIO 的接续维护分支，2026-08-06 从 pgsty/minio 更名而来，
      # 当前领先上游 minio/master 数百个 commit，承诺每 1~2 个月发一版。
      # 它的兼容契约正好覆盖本 job 需要的全部面：S3 协议、.minio.sys 数据格式、
      # MINIO_* 环境变量、minio_* 指标、x-minio-* 头、/minio/* 路由（含下面的 health 探针）。
      # 改名的只有交付面：二进制/服务/包/镜像都叫 silo，且不提供 minio 别名——所以容器
      # 里的命令是 `silo server /data`，而探活路径仍是 /minio/health/live。
      # 许可为 AGPL-3.0（与上游一致）。这里只把它当 CI 里的独立服务进程使用，不链接、
      # 不随产品分发，不触发分发侧的 AGPL 义务。
      #
      # 为什么不再用 coollabsio/minio：那是社区对上游**最后一版**（2025-10-15）的一次性
      # 重建，镜像从此冻结，不会再有安全修复；SILO 是持续发布的安全修复线，且 release
      # 页公布镜像 digest，可以做到 tag + digest 双锁（tag 可被重建覆盖，digest 不会）。
      # digest 出处：https://github.com/pgsty/silo/releases/tag/RELEASE.2026-10-18T00-00-00Z
      # 为什么不升到 10-26：该版 release 只说明「标准镜像存在」，未公布 digest；
      # 本 job 只用 S3 基线能力，无安全收益，等它公布 digest 再动。
      SILO_IMAGE: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: pull silo
        # 单独一步只为可诊断：之前 `docker run` 与拉取混在一起，失败只有 docker 的 125，
        # 分不清是镜像拉不到、架构不匹配还是端口占用。拆开后失败步骤名本身就是结论。
        run: docker pull "$SILO_IMAGE"
      - name: start silo
        run: |
          docker run -d --name silo -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=pptsminio -e MINIO_ROOT_PASSWORD=pptsminio123 \
            "$SILO_IMAGE" server /data --address ":9000" --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null || { echo "silo not ready"; exit 1; }
      - name: s3 adapter tests
        env:
          S3_ENDPOINT: localhost:9000
          S3_ACCESS_KEY: pptsminio
          S3_SECRET_KEY: pptsminio123
        run: go test ./internal/integrations/objectstore/s3/ -count=1 -v

  # 契约门禁：Buf lint + 兼容性（breaking）检查。
  proto:
    runs-on: ubuntu-latest
    env:
      # 版本只在这里写一次：主路径（官方 action）与备份路径（模块代理）必须装同一版，
      # 否则「本地过、CI 红」会因为 lint 规则随版本变化而重新出现。
      BUF_VERSION: "1.50.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 2026-11-08：这一步红过一次，原因是 **GitHub 发布资源 CDN 返回 504**：
      #   buf-setup-action 去 releases/download 拉 tar.gz，连续两次 504（间隔 15s）后放弃。
      # 与本仓库代码无关，但 action 自带的重试只有 2 次、间隔固定，覆盖不了一次持续几分钟的
      # 网关抖动；而这一步一红，lint/breaking 两条契约门禁根本没跑，等于整条 job 白跑。
      #
      # 所以主路径保持官方 action（它自带 sha 校验与 tool-cache），失败则**换一条网络路径**：
      # 走 Go 模块代理 `go install` 同一个版本。两条路径的失败原因基本不相关（GitHub 发布
      # CDN vs proxy.golang.org），代价是备份路径要现场编译（约 2–4 分钟），只在主路径失败时发生。
      # 不接受「把版本写死在镜像里」：那会让 proto job 依赖一个我们并不发布的自建镜像。
      - uses: bufbuild/buf-setup-action@v1
        id: buf_setup
        continue-on-error: true
        with:
          # 显式钉版本：action 的默认版本会随 @v1 浮动，而下面的版本校验要求两条路径
          # 装同一版；不钉的话，哪天默认版本变了，这里会红在"版本不符"而不是真问题。
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
      - name: setup go (buf fallback)
        if: steps.buf_setup.outcome != 'success'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: install buf via module proxy
        if: steps.buf_setup.outcome != 'success'
        run: |
          echo "buf-setup-action 失败，改走模块代理安装 buf ${BUF_VERSION}" >&2
          go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # 版本必须对得上：备份路径装错版本时，lint 规则差异会表现成"莫名其妙的规则报错"。
      - name: buf version
        run: |
          got=$(buf --version)
          echo "buf ${got}"
          if [ "$got" != "${BUF_VERSION}" ]; then
            echo "buf 版本不符：期望 ${BUF_VERSION}，实际 ${got}" >&2
            exit 1
          fi
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf breaking
        working-directory: proto
        run: buf breaking --against '../.git#branch=main,subdir=proto'

  # 第 7 项「该动的时候才动」的机器门禁自检。
  #
  # 为什么 CI 只跑 --self-test：真正的审计要成片、旁白音轨与三份测量报告，
  # 那些在 tmp/q7（.gitignore 里），CI 上不存在。但门禁**本身**是纯逻辑，
  # 可以喂合成数据——51 项逐条注入故障（剧透、无音轨、覆盖缺口、错落不符…），
  # 断言每种都能红。这样「门禁写坏了、永远返回通过」不会静默通过。
  #
  # 本地要跑真片：python3 scripts/fidelity/verify.py --rerun（约 2 分钟）
  fidelity:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 门禁自检（51 项故障注入）
        run: python3 scripts/fidelity/verify.py --self-test
      # 元素提取器的图表分支决定 V10 能不能判：它若静默返回空，图表页会一路报绿。
      # 只有这条路径要 python-pptx，不装它就没法在 CI 上守。
      - name: 元素提取器自检（图表数值）
        run: |
          python3 -m pip install --quiet python-pptx==1.0.2
          python3 scripts/fidelity/extract_pptx_elements.py --self-test
      # 切柱量的是坐标换算与「段数/柱高」的关系。它错了不会报错，只会切出错的框，
      # 然后 V11 指到隔壁那根柱——自检里的三条降级路径就是为这个守的。
      - name: 图表切柱自检（逐柱包围盒）
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 scripts/fidelity/split_chart_bars.py --self-test
      # 矩形焦点（图表柱子）在成片里不生效时，画面与「没有遮罩」一模一样，
      # 而 V13 量的是图层墨量——遮罩页一页都进不了统计，绿得毫无信息。
      # 这条守的是**测量本身**：叠白量反解、孔内外区分、时间分类、两种矩形写法。
      # numpy 上一步已装，不用重复安装。
      - name: 遮罩测量自检（孔与白纱）
        run: |
          python3 -m pip install --quiet numpy
          python3 scripts/fidelity/check_mask.py --self-test
      # 遮罩预览的 dim 是从 shared/motion.ts 的 FOCUS_DIM_OPACITY 推的，
      # 两边漂了看不出来，只有这条能守。
      - name: 遮罩预览自检（压暗强度对齐）
        run: python3 scripts/fidelity/mask_preview.py --self-test
      # V9 量的是「长度与数值成不成比例」，长度沿哪个方向取决于图的朝向：
      # 水平条按高度量会得到「厚度」，三根都是同一个数，正确的图被判红。
      - name: 柱高判据自检（数值方向）
        run: python3 scripts/fidelity/check_chart.py --self-test
      # Q7 真人讲稿重测的输入闸门：绑定器对写错的素材是静默的（compare() 只遍历
      # elements，金标里拼错一个 elementId 就被整条丢掉，分母变小、召回反而虚高；
      # main() 用 zip 按位置配对，两份页数不等会静默截断）。自检用离线合成夹具
      # 逐条注入故障，不需要真人稿，也不需要任何 tmp 产物。
      - name: 真人讲稿输入契约自检（静默错算）
        run: python3 scripts/fidelity/human_script_check.py --self-test
