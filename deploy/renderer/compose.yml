# 渲染服务的本地/单机部署样例。
#
# 三件事在这里被固定下来，改部署时不要顺手删：
#   1. 只读 rootfs + tmpfs 工作目录：渲染会把页面图、底板、片段写进 /work，
#      但容器本身不该可写（Chromium 的 CVE 大多要求落盘）。
#   2. 无外网：渲染不需要网络；给它外网只会多一条数据外泄路径。
#   3. 资源限额：数值来自 5.6 长片压测（ADR-16），不是估算。压测前的 2g / 256 PIDs 会让
#      单任务在第 4 页崩溃（PIDs 撞顶表现为 Node 的 write EPIPE，看不出原因）、
#      第 21 秒 OOM（2g 正好压在单任务峰值上，没有余量）。
services:
  renderer:
    build:
      context: ../..
      dockerfile: deploy/renderer/Dockerfile
      args:
        CHROME_VERSION: ${CHROME_VERSION:-156.0.8078.73}
        CHROME_SHA256: ${CHROME_SHA256:?run deploy/renderer/pin-chrome.sh first}
    image: ppts/renderer:dev
    ports:
      - "8090:8090"
    read_only: true
    # tmpfs 本身重启即清空，所以启动清扫（ADR-13）在这里是 no-op。
    # 换成持久卷时要靠它兜底：那种情况下新起的进程会删掉上一轮的孤儿目录，
    # 多副本共享同一个持久卷则必须给每个副本单独的 workdir（或用 -keep-orphans 关掉清扫）。
    # /tmp 也必须挂：Remotion 的 bundler 用 os.tmpdir() 打包，只读 rootfs 下会 EROFS。
    # mode=1777 是因为容器跑 UID 10001，tmpfs 默认 root:root 0755。
    tmpfs:
      - /work:size=2g,mode=1777
      - /tmp:size=512m,mode=1777
    # 底图：计划里的 baseImage 相对「只读资产根」解析，起跑时复制进 /work（ADR-14）。
    # 不挂这个目录、也不给 -assets-dir 时，任何带元素级图层的计划都会在 staging 失败。
    # 用之前把下面两行取消注释，并把宿主目录换成页面 PNG 的实际位置：
    # volumes:
    #   - /srv/ppts/pages:/assets:ro
    # 导出侧（worker）要把 PPTS_ANIMATION_ASSET_DIR 指到**同一个宿主目录**，
    # 由它把页图写进去（内容寻址命名、原子落地）。接线与 S3 换法见 README「单机部署」。
    # command: ["-addr", ":8090", "-backend", "remotion", "-workdir", "/work",
    #           "-renderer-script", "/app/render.mjs", "-assets-dir", "/assets"]
    # 片段缓存（M5）：落在**持久卷**上，不能放 /work 或 /tmp（都是 tmpfs，重启即空，
    # 等于每次都是冷启动）。多副本部署把它指向同一份共享存储，命中即可跨副本共享。
    # 不给 -segment-cache 就是「每页都渲」的旧行为。
    # 容量上限按「近 30 天可能被再次导出的片子」估：1080p30 的 30 秒片约 10–20MB，
    # 4GiB 大致对应 200–400 部；超限按 mtime 从旧到新淘汰，不会删刚写进去的那一条。
    # volumes:
    #   - /srv/ppts/segment-cache:/cache
    # command: ["-addr", ":8090", "-backend", "remotion", "-workdir", "/work",
    #           "-renderer-script", "/app/render.mjs", "-assets-dir", "/assets",
    #           "-segment-cache", "/cache", "-segment-cache-max-bytes", "4294967296",
    #           "-concurrency", "1", "-page-concurrency", "4"]
    # 上面最后的两个数是**达标配置**，不是随手填的（M5 实测，10 页 × 3s / 1080p30 / 5 次）：
    #   1 任务 × 4 页 × 1 帧 = 4 个渲染位 → P95 49.3s
    #   1 任务 × 2 页 × 2 帧 = 4 个渲染位 → P95 71.6s（同样的位，切开方式差 30%）
    #   1 任务 × 1 页 × 2 帧 = 2 个渲染位 → P95 133.9s（默认值，**达不到 120s 目标**）
    # 注意 -concurrency 同时喂「任务数」与「帧并发」，总位是三者乘积（ADR-16 的乘积结论）。
    # 注意：不要在这里补 -fonts。字体版本由镜像 entrypoint 从 /etc/ppts/fonts.version
    # 拼出来（见 Dockerfile 说明），在这里覆盖会让版本与实际字体脱节。
    network_mode: none
    # 这四行是同一台机器的两种切法，改一个要连带看另一个（ADR-16 §6）：
    #   cpus 4 + mem 6g + pids 2048  → 2 个任务 × 30 页并发实测 948s / 峰值 4826MB / PIDs 783
    #   cpus 4 时单任务用不满核，两个任务才能把 4 个渲染位喂饱（聚合吞吐近 2 倍）
    #   mem 压到 4g 而保留 2 个任务：第二个任务第 21 秒被 OOM 杀
    #   pids 压到 256：单任务第 4 页就崩，且报错是 EPIPE
    cpus: 4
    mem_limit: 6g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # 用 curl 不是 wget：这个镜像的 apt 列表里只有 curl，wget 从来没有装过，
      # 于是这条探针永远返回 127（command not found），容器一直被标成 unhealthy。
      # 实测：`docker run --entrypoint sh ppts/renderer:dev -c 'command -v wget'` 无输出。
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 发布前的一次性门禁：把 selftest 当成独立服务跑，失败即流水线失败。
  # 用法：docker compose -f deploy/renderer/compose.yml run --rm selftest
  selftest:
    image: ppts/renderer:dev
    profiles: ["selftest"]
    read_only: true
    tmpfs:
      - /work:size=1g,mode=1777
      - /tmp:size=512m,mode=1777
    network_mode: none
    entrypoint: ["/usr/local/bin/ppts-renderer"]
    command:
      - "-selftest"
      - "-backend=remotion"
      - "-workdir=/work"
      - "-renderer-script=/app/render.mjs"
