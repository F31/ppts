# 代码生成配置（G1 接入 Connect 时启用；buf generate）。
# Go: buf.build/protocolbuffers/go + buf.build/connectrpc/go
# TS:  buf.build/connectrpc/es + buf.build/bufbuild/es
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: ../gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../gen
    opt: paths=source_relative
