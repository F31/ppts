version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  # 契约按 V4.0 §11.1 直接返回领域类型（Project/Job/...），
  # 故排除三条 RPC 命名/复用规则；其余 STANDARD（未用 import、字段命名、包名等）保持。
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
